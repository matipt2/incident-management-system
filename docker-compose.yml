services:
  postgres:
    image: postgres:16.4
    container_name: incident-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_db}
      POSTGRES_USER: ${POSTGRES_USER:-incident_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_user} -d ${POSTGRES_DB:-incident_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: incident-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incident_db}
      JDBC_DATABASE_USERNAME: ${POSTGRES_USER:-incident_user}
      JDBC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-incident_password}
      JWT_SECRET: ${JWT_SECRET:-itl-incident-management-jwt-secret-key-for-dev-only-change-in-prod}
      ITL_SLA_SCHEDULER_ENABLED: ${ITL_SLA_SCHEDULER_ENABLED:-true}
      ITL_BOOTSTRAP_MANAGER_USERNAME: ${ITL_BOOTSTRAP_MANAGER_USERNAME:-}
      ITL_BOOTSTRAP_MANAGER_EMAIL: ${ITL_BOOTSTRAP_MANAGER_EMAIL:-}
      ITL_BOOTSTRAP_MANAGER_PASSWORD: ${ITL_BOOTSTRAP_MANAGER_PASSWORD:-}
      ITL_DEMO_DATA_ENABLED: ${ITL_DEMO_DATA_ENABLED:-false}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: incident-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_data:
